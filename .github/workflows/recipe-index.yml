name: Recipe Front Matter and Index

on:
  pull_request:
    paths:
      - "recipes/**/*.md"
      - ".skills/recipe-frontmatter/**"
      - "scripts/recipe_index.py"
      - "tests/**"
      - "requirements.txt"
      - "agents.md"
      - "README.md"
      - ".github/workflows/recipe-index.yml"
  push:
    branches:
      - main
    paths:
      - "recipes/**/*.md"
      - ".skills/recipe-frontmatter/**"
      - "scripts/recipe_index.py"
      - "tests/**"
      - "requirements.txt"
      - "agents.md"
      - "README.md"
      - ".github/workflows/recipe-index.yml"

permissions: {}

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate Front Matter
        run: python scripts/recipe_index.py validate
      - name: Generate recipe index
        run: python scripts/recipe_index.py generate
      - name: Check generated diff
        run: git diff --exit-code -- README.md

  update-main-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Front Matter
        run: python scripts/recipe_index.py validate
      - name: Generate recipe index
        run: python scripts/recipe_index.py generate
      - name: Commit generated index when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Recipe index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update recipe index [skip ci]"
          git push
